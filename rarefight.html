  /* Layout: one narrow column laid out like a fight card. Red corner is player 1, blue corner is player 2,
     and the active corner floods the turn screen. Answers are scored as punches: jab, hook, uppercut, knockout. */
  :root {
    --f-display: 'Big Shoulders Display', 'Arial Narrow', 'Helvetica Neue', sans-serif;
    --f-body: 'Archivo', 'Helvetica Neue', Arial, sans-serif;

    --bg: #E7EAF0; --panel: #F5F6F9; --ink: #12161E; --muted: #576072; --line: #C5CBD6; --soft: #D8DDE6;
    --red: #CF2D3D; --red-text: #B01F2E; --blue: #1F5FC4; --blue-text: #1A52AD;
    --gold: #F0B400; --gold-ink: #241800;
    --on-color: #FFFFFF; --on-color-dim: rgba(255, 255, 255, 0.3);
    color-scheme: light;

  @media (prefers-color-scheme: dark) {

      --bg: #0F1218; --panel: #171B24; --ink: #EDEFF4; --muted: #9BA3B5; --line: #2C3342; --soft: #262C3A;
      --red: #D5303F; --red-text: #FF7B87; --blue: #2F6FDB; --blue-text: #86B3FF;
      --gold: #F0B400; --gold-ink: #241800;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1218; --panel: #171B24; --ink: #EDEFF4; --muted: #9BA3B5; --line: #2C3342; --soft: #262C3A;
    --red: #D5303F; --red-text: #FF7B87; --blue: #2F6FDB; --blue-text: #86B3FF;
    --gold: #F0B400; --gold-ink: #241800;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--ink); font: 16px/1.45 var(--f-body);
    padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px));
    min-height: 100vh;
  }
  h1, h2, h3, p, ul, ol { margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .wrap { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
  .wrap.wide { max-width: 880px; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .eyebrow { font: 600 .72rem/1.2 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .lede { color: var(--muted); font-size: 1.02rem; max-width: 44ch; }
  .hint { color: var(--muted); font-size: .88rem; }
  .link { background: none; border: 0; padding: 8px 0; min-height: 40px; color: var(--muted); text-decoration: underline; font: 600 .9rem var(--f-body); align-self: flex-start; }

  /* Title */
  .mark { font: 900 clamp(4.2rem, 24vw, 7.8rem)/.8 var(--f-display); text-transform: uppercase; letter-spacing: -.01em; display: flex; flex-direction: column; gap: .06em; padding-top: 8px; }
  .mark .r { color: var(--red-text); }
  .mark .b { color: var(--blue-text); align-self: flex-end; }

  /* Cards and setup */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .corners { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .corner { display: flex; flex-direction: column; gap: 8px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-top: 6px solid var(--line); border-radius: 4px; min-width: 0; }
  .corner.red { border-top-color: var(--red); } .corner.blue { border-top-color: var(--blue); }
  .corner.red .eyebrow { color: var(--red-text); } .corner.blue .eyebrow { color: var(--blue-text); }
  .field { flex: 1; min-width: 0; width: 100%; min-height: 52px; padding: 0 12px; font: 500 1.1rem var(--f-body); background: var(--bg); color: var(--ink); border: 2px solid var(--ink); border-radius: 4px; }
  .field::placeholder { color: var(--muted); opacity: 1; }
  .set { display: flex; flex-direction: column; gap: 8px; }
  .set .lab { font-weight: 700; }
  .seg { display: flex; border: 2px solid var(--ink); border-radius: 4px; overflow: hidden; }
  .seg button { flex: 1; min-height: 44px; background: transparent; border: 0; border-left: 2px solid var(--ink); font: 600 1rem var(--f-mono); }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .tiers { list-style: none; padding: 0; display: flex; flex-direction: column; }
  .tiers li { display: grid; grid-template-columns: 8rem 1fr; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .tiers li:first-child { border-top: 0; }
  .tiers .chip { justify-self: start; }

  /* Buttons */
  .btn { min-height: 54px; padding: 0 20px; border: 2px solid var(--ink); border-radius: 4px; background: var(--ink); color: var(--bg); font: 800 1.35rem/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; width: 100%; }
  .btn.compact { width: auto; flex: none; min-width: 84px; }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn.red { background: var(--red); border-color: var(--red); color: var(--on-color); }
  .btn.blue { background: var(--blue); border-color: var(--blue); color: var(--on-color); }
  .btn:active { transform: translateY(1px); }

  /* Score tug bar */
  .tug { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  .tug-side { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .tug-side.blue { justify-content: flex-end; }
  .tug-name { font-weight: 700; font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .tug-side.red .tug-name { color: var(--red-text); } .tug-side.blue .tug-name { color: var(--blue-text); }
  .tug-pts { font: 900 2.2rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
  .tug-bar { grid-column: 1 / -1; height: 12px; background: var(--blue); border-radius: 2px; overflow: hidden; }
  .tug-bar i { display: block; height: 100%; background: var(--red); transition: width .5s; }

  /* Category title */
  .cat { font: 800 clamp(2rem, 9vw, 3rem)/.95 var(--f-display); text-transform: uppercase; text-wrap: balance; letter-spacing: .01em; }

  /* Turn screen */
  .band { border-radius: 6px; padding: 16px; color: var(--on-color); display: flex; flex-direction: column; gap: 14px; }

  .band-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .who { font: 600 .72rem/1.2 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; min-width: 0; }
  .who b { display: block; font: 800 1.5rem/1 var(--f-display); letter-spacing: .04em; margin-top: 4px; overflow-wrap: anywhere; }
  .secs { font: 600 3.2rem/.9 var(--f-mono); font-variant-numeric: tabular-nums; }
  .clockbar { height: 8px; background: var(--on-color-dim); border-radius: 2px; overflow: hidden; }
  .clockbar i { display: block; height: 100%; background: var(--on-color); width: 100%; }
  .band.urgent .secs { animation: pulse .5s steps(2) infinite; }
  .band.done .secs { animation: none; }
  @keyframes pulse { 50% { opacity: .35; } }
  .addrow { display: flex; gap: 8px; }
  .msg { min-height: 1.4em; font-size: .9rem; color: var(--muted); }
  .listhead { display: flex; justify-content: space-between; align-items: center; }
  .answers { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { padding: 7px 11px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; font-weight: 600; overflow-wrap: anywhere; animation: pop .18s ease-out; display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  @keyframes pop { from { transform: scale(.92); opacity: .4; } }

  /* Pass screen */
  .pass { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; }
  .pass .name { font: 900 clamp(3rem, 16vw, 5.5rem)/.85 var(--f-display); text-transform: uppercase; overflow-wrap: anywhere; }
  .pass .name.red { color: var(--red-text); } .pass .name.blue { color: var(--blue-text); }

  /* Reveal */
  .lead { font: 800 1.5rem/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
  .lead.red { color: var(--red-text); } .lead.blue { color: var(--blue-text); }

  .col-h.red { background: var(--red); } .col-h.blue { background: var(--blue); }
  .col-h b { font: 800 1.4rem/1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; overflow-wrap: anywhere; }
  .col-h span { font: 900 2.4rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
  .rows { list-style: none; padding: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); min-width: 0; }
  .row .txt { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
  .row small { display: block; color: var(--muted); font-weight: 400; font-size: .78rem; }
  .row.clash .txt { text-decoration: line-through; color: var(--muted); }

  .chip { flex: none; font: 600 .74rem/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 6px 8px; border-radius: 3px; border: 1px solid transparent; white-space: nowrap; background: transparent; color: var(--ink); }
  .chip.t0 { border: 1px dashed var(--ink); }
  .chip.t1 { border-color: var(--muted); color: var(--muted); }
  .chip.t2 { background: var(--soft); color: var(--ink); }
  .chip.t3 { background: var(--ink); color: var(--bg); }
  .chip.t4 { background: var(--gold); color: var(--gold-ink); }
  .chip.clash { border-color: var(--line); color: var(--muted); }

  .verdict.red { color: var(--red-text); } .verdict.blue { color: var(--blue-text); }
  .final-score { font: 800 2rem/1 var(--f-mono); font-variant-numeric: tabular-nums; }
  .tbl { display: grid; grid-template-columns: 2rem 1fr 3rem 3rem; gap: 0 8px; align-items: center; font-size: .92rem; }
  .tbl > * { padding: 8px 0; border-top: 1px solid var(--line); min-width: 0; }
  .tbl .h { font: 600 .7rem/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-top: 0; }
  .tbl .h.r { text-align: right; }
  .tbl .n { font: 600 .85rem var(--f-mono); color: var(--muted); }
  .tbl .c { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tbl .p { font: 600 1rem var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
  .tbl .p.win { font-weight: 700; }
  .tbl .p.win.red { color: var(--red-text); } .tbl .p.win.blue { color: var(--blue-text); }
  .best { display: flex; flex-direction: column; gap: 4px; }
  .best b { font: 800 1.3rem/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
  .best.red b { color: var(--red-text); } .best.blue b { color: var(--blue-text); }

  .live .row:first-child { border-top: 0; }
  .live .empty { padding: 14px; color: var(--muted); font-size: .92rem; }
  .pows { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
  .pu { flex: 1; min-width: 130px; min-height: 48px; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 12px; background: var(--panel); border: 2px solid var(--ink); border-radius: 4px; font: 700 .95rem var(--f-body); text-align: left; }
  .pu i { font: 600 .8rem var(--f-mono); font-style: normal; display: inline-flex; align-items: center; gap: 6px; }

  .coin { width: 14px; height: 14px; border-radius: 50%; background: var(--gold); border: 2px solid var(--gold-ink); display: inline-block; flex: none; }

  .hints { display: flex; flex-direction: column; gap: 6px; }

  .packs { display: flex; flex-wrap: wrap; gap: 8px; }
  .pack { min-height: 40px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 4px; background: transparent; font: 600 .9rem var(--f-body); }
  .pack[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

  .colophon a { display: inline-block; min-height: 40px; line-height: 40px; padding: 0 8px; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

  function has(obj, k) { return Object.prototype.hasOwnProperty.call(obj, k); }

  /* ---------- Matching ---------- */

  function stem(w) {
    if (w.length > 4 && /ies$/.test(w)) return w.slice(0, -3) + 'y';
    if (w.length > 3 && /(ch|sh|ss|x|z)es$/.test(w)) return w.slice(0, -2);
    if (w.length > 3 && /s$/.test(w) && !/(ss|us|is)$/.test(w)) return w.slice(0, -1);
    return w;
  }

  function norm(s) {
    s = String(s).toLowerCase();
    if (s.normalize) s = s.normalize('NFD').replace(/[̀-ͯ]/g, '');
    s = s.replace(/&/g, ' and ').replace(/[’']/g, '').replace(/[^a-z0-9 \-]/g, ' ')
         .replace(/-/g, ' ').replace(/\s+/g, ' ').trim();
    s = s.replace(/^(a|an|the) /, '');
    var w = s.split(' ');
    w[w.length - 1] = stem(w[w.length - 1]);
    return w.join(' ');
  }

  /* Each tier string is "a, b|alias, c". The first alias is the label everyone sees. */
  function labelsOf(ci, ti) {
    return BANK[ci].t[ti].split(',').map(function (e) { return e.split('|')[0].trim(); }).filter(Boolean);
  }

  var idxCache = {};
  function getIndex(ci) {
    if (idxCache[ci]) return idxCache[ci];
    var idx = { keys: [], byKey: {}, noSpace: {} };
    BANK[ci].t.forEach(function (str, ti) {
      str.split(',').forEach(function (entry) {
        var aliases = entry.split('|').map(function (a) { return a.trim(); }).filter(Boolean);
        if (!aliases.length) return;
        var label = aliases[0], key = 'k:' + norm(label);
        aliases.forEach(function (a) {
          var nk = norm(a);
          if (!has(idx.byKey, nk)) {
            idx.byKey[nk] = { key: key, label: label, tier: ti + 1 };
            idx.keys.push(nk);
          }
        });
      });
    });
    idx.keys.forEach(function (k) {
      var s = k.replace(/ /g, '');
      if (!has(idx.noSpace, s)) idx.noSpace[s] = idx.byKey[k];
    });
    idxCache[ci] = idx;
    return idx;
  }

  function lev(a, b) {
    var m = a.length, n = b.length, i, j;
    if (Math.abs(m - n) > 2) return 9;
    var prev = [], cur;
    for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++) {
      cur = [i];
      for (j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[n];
  }

  function judge(ci, raw) {
    var text = String(raw).trim().replace(/\s+/g, ' ');
    var nk = norm(text);
    if (nk.length < 2) return { status: 'empty' };
    var cat = BANK[ci];
    if (cat.ban && nk === norm(cat.ban)) return { status: 'banned' };
    if (cat.pre && nk.replace(/ /g, '').indexOf(cat.pre) !== 0) return { status: 'prefix', pre: cat.pre };
    var idx = getIndex(ci), compact = nk.replace(/ /g, '');
    var hit = has(idx.byKey, nk) ? idx.byKey[nk] : (has(idx.noSpace, compact) ? idx.noSpace[compact] : null);
    var fuzzy = false;
    if (!hit && nk.length >= 5) {
      var lim = nk.length >= 9 ? 2 : 1, best = null, bd = 99;
      idx.keys.forEach(function (k) {
        if (k.charAt(0) !== nk.charAt(0)) return;
        var d = lev(nk, k);
        if (d <= lim && d < bd) { bd = d; best = idx.byKey[k]; }
      });
      if (best) { hit = best; fuzzy = true; }
    }
    if (hit) return { status: 'ok', key: hit.key, label: hit.label, tier: hit.tier, fuzzy: fuzzy, text: text };
    return { status: 'ok', key: 'u:' + nk, label: text, tier: 0, fuzzy: false, text: text };
  }

  /* ---------- State and persistence ---------- */

  var STORE_KEY = 'rarefight:game';
  /* Bump when BANK is reordered or categories are removed: a saved game refers to categories by index. */
  var DATA_VERSION = 2;
  var PHASES = ['setup', 'ready', 'turn', 'pass', 'reveal', 'final'];

  function defaultCfg() {
    return { names: ['', ''], rounds: 5, secs: 45, clash: true, sound: true, packs: GROUPS.slice() };
  }
  function freshState() {
    return { v: DATA_VERSION, phase: 'setup', cfg: defaultCfg(), coins: [STARTING_COINS, STARTING_COINS],
             round: 0, pool: [], cur: null, pass: null, totals: [0, 0], history: [] };
  }

  var state = freshState();

  function save() {
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* Private Browsing */ }
  }

  function isCat(i) { return typeof i === 'number' && i >= 0 && i < BANK.length && i % 1 === 0; }
  function isPair(a) { return Array.isArray(a) && a.length === 2; }

  function validRound(cur) {
    return cur && typeof cur === 'object' && isCat(cur.ci) &&
      isPair(cur.answers) && Array.isArray(cur.answers[0]) && Array.isArray(cur.answers[1]) &&
      (cur.turn === 0 || cur.turn === 1);
  }

  function validGame(s) {
    if (typeof s.round !== 'number' || !isPair(s.totals) || !Array.isArray(s.pool) || !Array.isArray(s.history)) return false;
    if (!s.pool.every(isCat)) return false;
    if (!s.history.every(function (h) { return h && isCat(h.ci) && isPair(h.rows) && isPair(h.rt); })) return false;
    if (s.phase === 'final') return true;
    return validRound(s.cur);
  }

  function load() {
    var raw = null, s;
    try { raw = window.localStorage.getItem(STORE_KEY); } catch (e) { return; }
    if (!raw) return;
    try { s = JSON.parse(raw); } catch (e) { return; }
    if (!s || typeof s !== 'object') return;

    var d = freshState();
    var sc = s.cfg && typeof s.cfg === 'object' ? s.cfg : {};
    if (Array.isArray(sc.names)) d.cfg.names = [String(sc.names[0] || ''), String(sc.names[1] || '')];
    if (ROUND_OPTIONS.indexOf(sc.rounds) >= 0) d.cfg.rounds = sc.rounds;
    if (SECS_OPTIONS.indexOf(sc.secs) >= 0) d.cfg.secs = sc.secs;
    if (typeof sc.clash === 'boolean') d.cfg.clash = sc.clash;
    if (typeof sc.sound === 'boolean') d.cfg.sound = sc.sound;
    if (Array.isArray(sc.packs)) {
      var packs = sc.packs.filter(function (g) { return GROUPS.indexOf(g) >= 0; });
      if (packs.length) d.cfg.packs = packs;
    }
    if (isPair(s.coins)) d.coins = [Math.max(0, +s.coins[0] || 0), Math.max(0, +s.coins[1] || 0)];

    /* A game saved against a different category list is abandoned; settings and coins carry over. */
    if (s.v === DATA_VERSION && PHASES.indexOf(s.phase) > 0 && validGame(s)) {
      d.phase = s.phase;
      d.round = s.round;
      d.pool = s.pool;
      d.cur = s.cur;
      d.pass = s.pass && typeof s.pass === 'object' ? s.pass : null;
      d.totals = [+s.totals[0] || 0, +s.totals[1] || 0];
      d.history = s.history;
      if (d.cur) {
        if (!isPair(d.cur.adj)) d.cur.adj = [{}, {}];
        if (!isPair(d.cur.hints)) d.cur.hints = [[], []];
        if (!Array.isArray(d.cur.left)) d.cur.left = [];
      }
      if (d.phase === 'turn') {
        /* A clock can't resume mid-turn, so that player starts their turn again from nothing. */
        var p = (d.round + d.cur.turn) % 2;
        d.cur.answers[p] = [];
        if (d.cur.turn === 0) d.phase = 'ready';
        else { d.phase = 'pass'; d.pass = { to: p }; }
      }
      if (d.phase === 'pass' && !d.pass) d.pass = { to: d.cur.turn === 0 ? (d.round + 1) % 2 : -1 };
    }
    state = d;
  }

  function nm(p) { return (state.cfg.names[p] || '').trim() || ('Player ' + (p + 1)); }
  function cls(p) { return p === 0 ? 'red' : 'blue'; }
  function cornerName(p) { return p === 0 ? 'Red corner' : 'Blue corner'; }
  function who(t) { return (state.round + t) % 2; }

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i];
      a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------- Sound ---------- */

  var actx = null;
  function unlock() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.resume) actx.resume();
    } catch (e) { actx = null; }
  }
  function beep(f, d, v) {
    if (!state.cfg.sound || !actx) return;
    try {
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square'; o.frequency.value = f; g.gain.value = v == null ? 0.08 : v;
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + d);
    } catch (e) { /* no sound is fine */ }
  }

  /* ---------- Round logic ---------- */

  function go(ph) { state.phase = ph; save(); renderAll(); window.scrollTo(0, 0); }

  function eligible() {
    var out = [];
    BANK.forEach(function (c, i) { if (state.cfg.packs.indexOf(c.g) >= 0) out.push(i); });
    return out;
  }

  function startGame() {
    state.pool = shuffle(eligible());
    state.round = 0; state.totals = [0, 0]; state.history = [];
    newRound();
  }

  function newRound() {
    if (!state.pool.length) state.pool = shuffle(eligible());
    state.cur = { ci: state.pool.pop(), answers: [[], []], adj: [{}, {}], hints: [[], []], turn: 0, left: [] };
    state.pass = null;
    go('ready');
  }

  /* Scores for the reveal: a clash is 0, an unlisted answer takes the agreed judge score (2 until changed). */
  function buildRows() {
    var r = state.cur;
    return [0, 1].map(function (p) {
      return r.answers[p].map(function (a, i) {
        var clash = state.cfg.clash && r.answers[1 - p].some(function (b) { return b.key === a.key; });
        var unlisted = a.tier === 0;
        var base = unlisted ? (r.adj[p][i] != null ? r.adj[p][i] : 2) : T[a.tier].pts;
        return { text: a.text, key: a.key, label: a.label, tier: a.tier, fuzzy: a.fuzzy,
                 i: i, clash: clash, unlisted: unlisted, pts: clash ? 0 : base };
      });
    });
  }

  function sum(rows) { return rows.reduce(function (n, r) { return n + r.pts; }, 0); }

  function usedKeys() {
    var used = {};
    state.cur.answers[0].concat(state.cur.answers[1]).forEach(function (a) { used[a.key] = true; });
    return used;
  }

  function computeLeft() {
    var used = usedKeys(), out = [];
    [3, 2].forEach(function (ti) {
      var labels = labelsOf(state.cur.ci, ti).filter(function (l) { return !used['k:' + norm(l)]; });
      shuffle(labels).forEach(function (l) { if (out.length < 4) out.push({ l: l, tier: ti + 1 }); });
    });
    state.cur.left = out;
  }

  /* ---------- Timer and turns ---------- */

  var timer = null, deadline = 0, total = 0, lastSec = -1, ending = false;
  var ui = {};

  function startTurn() {
    ending = false;
    state.phase = 'turn';
    save();
    renderAll();
    total = state.cfg.secs * 1000; deadline = Date.now() + total; lastSec = -1;
    clearInterval(timer); timer = setInterval(tick, 100); tick();
  }

  function tick() {
    if (state.phase !== 'turn' || !ui.secs) return;
    var rem = deadline - Date.now();
    ui.clock.style.width = Math.max(0, rem / total * 100) + '%';
    var s = Math.max(0, Math.ceil(rem / 1000));
    ui.secs.textContent = s;
    if (s <= 5) ui.band.classList.add('urgent');
    if (s <= 3 && s > 0 && s !== lastSec) beep(880, 0.07);
    lastSec = s;
    if (rem <= 0) endTurn(true);
  }

  function endTurn(timeUp) {
    if (ending) return;
    ending = true; clearInterval(timer); renderPows();
    if (timeUp && ui.ans && ui.ans.value.trim()) submitAnswer();
    if (ui.ans) ui.ans.disabled = true;
    if (ui.band) ui.band.classList.add('done');
    if (timeUp) { if (ui.secs) ui.secs.textContent = '0'; beep(440, 0.6, 0.12); }
    setTimeout(function () {
      ending = false;
      if (state.cur.turn === 0) { state.cur.turn = 1; state.pass = { to: who(1) }; }
      else state.pass = { to: -1 };
      go('pass');
    }, timeUp ? 1100 : 250);
  }

  function submitAnswer() {
    var inp = ui.ans;
    if (!inp) return;
    var raw = inp.value;
    if (!raw.trim()) return;
    var p = who(state.cur.turn), list = state.cur.answers[p];
    var j = judge(state.cur.ci, raw);
    if (j.status === 'empty') { ui.msg.textContent = 'Too short.'; return; }
    if (j.status === 'banned') { ui.msg.textContent = 'That is the prompt word. Try another.'; inp.select(); return; }
    if (j.status === 'prefix') { ui.msg.textContent = 'It has to start with “' + j.pre + '”.'; inp.select(); return; }
    var dupe = null;
    list.forEach(function (a) { if (!dupe && a.key === j.key) dupe = a; });
    if (dupe) {
      ui.msg.textContent = 'Already in your list' +
        (dupe.text.toLowerCase() === j.text.toLowerCase() ? '.' : ' as “' + dupe.text + '”.');
      inp.select();
      return;
    }
    list.push({ text: j.text, key: j.key, label: j.label, tier: j.tier, fuzzy: j.fuzzy });
    inp.value = ''; ui.msg.textContent = '';
    renderAnswers();
    inp.focus();
  }

  /* ---------- DOM helpers ---------- */

  var app = document.getElementById('app');

  function el(tag, className, text) {
    var n = document.createElement(tag);
    if (className) n.className = className;
    if (text != null) n.textContent = text;
    return n;
  }
  function btn(className, act, text) {
    var b = el('button', className, text);
    b.type = 'button';
    b.setAttribute('data-act', act);
    return b;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function text(parent, s) { parent.appendChild(document.createTextNode(s)); return parent; }
  function closestAct(node) {
    while (node && node !== app) {
      if (node.getAttribute && node.getAttribute('data-act')) return node;
      node = node.parentNode;
    }
    return null;
  }

  function chip(tier, pts) {
    var name = tier ? T[tier].n : 'Judge';
    return el('span', 'chip t' + tier, name + ' +' + pts);
  }

  function tug(tot) {
    tot = tot || state.totals;
    var a = tot[0], b = tot[1], share = (a + b) ? a / (a + b) * 100 : 50;
    var wrap = el('div', 'tug');
    var red = el('div', 'tug-side red');
    red.appendChild(el('span', 'tug-name', nm(0)));
    red.appendChild(el('span', 'tug-pts', a));
    var blue = el('div', 'tug-side blue');
    blue.appendChild(el('span', 'tug-pts', b));
    blue.appendChild(el('span', 'tug-name', nm(1)));
    var bar = el('div', 'tug-bar');
    bar.setAttribute('role', 'img');
    bar.setAttribute('aria-label', nm(0) + ' ' + a + ', ' + nm(1) + ' ' + b);
    var fill = el('i');

    wrap.appendChild(red); wrap.appendChild(blue); wrap.appendChild(bar);

  }

  function segSet(label, k, vals, fmt) {

  function liveRow(a) {

      c.setAttribute('data-p', p);
      c.setAttribute('data-i', r.i);
      c.setAttribute('aria-label', 'Score for ' + r.text + ', currently ' + r.pts + '. Tap to change.');
    } else c = chip(r.tier, r.pts);
    li.appendChild(c);
    return li;
  }

  function revealCol(p, rows, rt) {
    var col = el('section', 'col');
    var head = el('header', 'col-h ' + cls(p));
    head.appendChild(el('b', '', nm(p)));
    head.appendChild(el('span', '', rt));
    col.appendChild(head);
    if (rows.length) {
      var ul = el('ul', 'rows');
      rows.forEach(function (r) { ul.appendChild(revealRow(p, r)); });
      col.appendChild(ul);
    } else {
      col.appendChild(el('p', 'empty', 'No answers.'));
    }
    return col;
  }

  function renderReveal() {
    var rows = buildRows(), rt = rows.map(sum), cat = BANK[state.cur.ci];
    var proj = [state.totals[0] + rt[0], state.totals[1] + rt[1]];
    var w = rt[0] === rt[1] ? -1 : (rt[0] > rt[1] ? 0 : 1);
    var anyJudge = rows.some(function (rs) { return rs.some(function (r) { return r.unlisted && !r.clash; }); });
    var last = state.round + 1 >= state.cfg.rounds;

    var wrap = el('div', 'wrap wide');
    wrap.appendChild(tug(proj));
    var stack = el('div', 'stack');
    stack.appendChild(el('p', 'eyebrow', 'Round ' + (state.round + 1) + ' of ' + state.cfg.rounds + ' scored'));
    stack.appendChild(el('h2', 'cat', cat.n));
    stack.appendChild(el('p', 'lead' + (w < 0 ? '' : ' ' + cls(w)),
      w < 0 ? 'Round drawn' : nm(w) + ' takes the round by ' + Math.abs(rt[0] - rt[1])));
    wrap.appendChild(stack);
    if (anyJudge) wrap.appendChild(el('p', 'note', 'Answers marked Judge are not on the built-in list. Agree a score together: tap to step through 0 to 4. They start at 2.'));
    var cols = el('div', 'cols');
    cols.appendChild(revealCol(0, rows[0], rt[0]));
    cols.appendChild(revealCol(1, rows[1], rt[1]));
    wrap.appendChild(cols);
    wrap.appendChild(el('p', 'note', 'Coins earned when you continue: ' + nm(0) + ' +' + rt[0] + ', ' + nm(1) + ' +' + rt[1] + '.'));
    if (state.cur.left.length) {
      var card = el('section', 'card');
      card.appendChild(el('h3', 'eyebrow', 'Still on the table'));
      var ul = el('ul', 'answers');
      state.cur.left.forEach(function (x) {
        var li = el('li', 'pill', x.l + ' ');
        li.appendChild(chip(x.tier, T[x.tier].pts));
        ul.appendChild(li);
      });
      card.appendChild(ul);
      wrap.appendChild(card);
    }
    wrap.appendChild(btn('btn', 'next', last ? 'Final scorecard' : 'Next round'));
    app.appendChild(wrap);
  }

  function bestOf(p) {
    var best = null;
    state.history.forEach(function (h) {
      h.rows[p].forEach(function (r) {
        if (!r.clash && (!best || r.pts > best.r.pts)) best = { r: r, ci: h.ci };
      });
    });
    return best;
  }

  function renderFinal() {
    var a = state.totals[0], b = state.totals[1], w = a === b ? -1 : (a > b ? 0 : 1);
    var wrap = el('div', 'wrap');
    wrap.appendChild(el('p', 'eyebrow', 'Final scorecard'));
    wrap.appendChild(el('h2', 'verdict' + (w < 0 ? '' : ' ' + cls(w)), w < 0 ? 'Draw' : nm(w) + ' wins'));
    wrap.appendChild(el('p', 'final-score', a + ' – ' + b));
    wrap.appendChild(tug());

    var card = el('section', 'card');
    var tbl = el('div', 'tbl');
    tbl.appendChild(el('span', 'h', '#'));
    tbl.appendChild(el('span', 'h', 'Category'));
    tbl.appendChild(el('span', 'h r', nm(0).slice(0, 3)));
    tbl.appendChild(el('span', 'h r', nm(1).slice(0, 3)));
    state.history.forEach(function (h, i) {
      var rw = h.rt[0] === h.rt[1] ? -1 : (h.rt[0] > h.rt[1] ? 0 : 1);
      tbl.appendChild(el('span', 'n', i + 1));
      tbl.appendChild(el('span', 'c', BANK[h.ci].n));
      tbl.appendChild(el('span', 'p' + (rw === 0 ? ' win red' : ''), h.rt[0]));
      tbl.appendChild(el('span', 'p' + (rw === 1 ? ' win blue' : ''), h.rt[1]));
    });
    card.appendChild(tbl);
    wrap.appendChild(card);

    var bests = el('section', 'card');
    var any = false;
    [0, 1].forEach(function (p) {
      var x = bestOf(p);
      if (!x) return;
      any = true;
      var box = el('div', 'best ' + cls(p));
      box.appendChild(el('span', 'eyebrow', nm(p) + '’s best punch'));
      box.appendChild(el('b', '', (x.r.tier ? x.r.label : x.r.text) + ' +' + x.r.pts));
      box.appendChild(el('span', 'hint', BANK[x.ci].n));
      bests.appendChild(box);
    });
    if (any) wrap.appendChild(bests);

    var actions = el('div', 'actions');
    actions.appendChild(btn('btn', 'start', 'Rematch'));
    actions.appendChild(btn('btn ghost', 'setup', 'Change settings'));
    wrap.appendChild(actions);
    app.appendChild(wrap);
  }

  function renderAll() {
    clear(app);
    ui = {};
    switch (state.phase) {
      case 'ready': renderReady(); break;
      case 'turn': renderTurn(); break;
      case 'pass': renderPass(); break;
      case 'reveal': renderReveal(); break;
      case 'final': renderFinal(); break;
      default: renderSetup();
    }
  }

  /* ---------- Events ---------- */

  var actions = {
    set: function (b) {
      var v = b.getAttribute('data-v');
      state.cfg[b.getAttribute('data-k')] = v === 'true' ? true : v === 'false' ? false : Number(v);
      save(); renderAll();
    },
    pack: function (b) {
      var g = b.getAttribute('data-v'), p = state.cfg.packs, i = p.indexOf(g);
      if (i >= 0) { if (p.length > 1) p.splice(i, 1); }
      else p.push(g);
      save(); renderAll();
    },
    start: function () { startGame(); },
    go: function () { startTurn(); },
    reroll: function () {
      var old = state.cur.ci;
      if (!state.pool.length) state.pool = shuffle(eligible().filter(function (i) { return i !== old; }));
      if (!state.pool.length) return;
      state.pool.unshift(old);
      state.cur.ci = state.pool.pop();
      save(); renderAll();
    },
    quit: function (b) {
      if (!b.getAttribute('data-sure')) {
        b.setAttribute('data-sure', '1');
        b.textContent = 'Tap again to end the game';
        return;
      }
      state.cur = null; state.pass = null;
      go('setup');
    },
    finish: function () { endTurn(false); },
    chrono: function () {
      var p = who(state.cur.turn);
      if (ending || state.coins[p] < CHRONO_COST) return;
      state.coins[p] -= CHRONO_COST; save();
      deadline += 10000; total += 10000;
      renderPows();
      if (ui.ans) ui.ans.focus();
    },
    joker: function () {
      var p = who(state.cur.turn);
      if (ending || state.coins[p] < JOKER_COST) return;
      var used = {}, given = {};
      state.cur.answers[p].forEach(function (a) { used[a.key] = true; });
      state.cur.hints[p].forEach(function (h) { given[h.l] = true; });
      var pool = labelsOf(state.cur.ci, 2).concat(labelsOf(state.cur.ci, 3))
        .filter(function (l) { return !used['k:' + norm(l)] && !given[l]; });
      if (!pool.length) { ui.msg.textContent = 'No hints left for this category.'; return; }
      var l = pool[Math.floor(Math.random() * pool.length)];
      var m = l.split(' ').map(function (w) {
        var dashes = '';
        for (var k = 1; k < w.length; k++) dashes += '_';
        return w.charAt(0) + dashes;
      }).join('  ');
      state.cur.hints[p].push({ l: l, m: m });
      state.coins[p] -= JOKER_COST; save();
      renderPows();
      if (ui.ans) ui.ans.focus();
    },
    reveal: function () { computeLeft(); beep(660, 0.15); go('reveal'); },
    adj: function (b) {
      var p = +b.getAttribute('data-p'), i = +b.getAttribute('data-i'), cur = state.cur.adj[p][i];
      state.cur.adj[p][i] = ((cur != null ? cur : 2) + 1) % 5;
      var y = window.scrollY;
      save(); renderAll();
      window.scrollTo(0, y);
    },
    next: function () {
      var rows = buildRows(), rt = rows.map(sum);
      state.history.push({ ci: state.cur.ci, rows: rows, rt: rt });
      state.totals = [state.totals[0] + rt[0], state.totals[1] + rt[1]];
      state.coins = [state.coins[0] + rt[0], state.coins[1] + rt[1]];
      state.round++;
      if (state.round >= state.cfg.rounds) { state.cur = null; state.pass = null; go('final'); }
      else newRound();
    },
    setup: function () { state.cur = null; state.pass = null; go('setup'); }
  };

  app.addEventListener('click', function (e) {
    var b = closestAct(e.target);
    if (!b) return;
    unlock();
    var fn = actions[b.getAttribute('data-act')];
    if (fn) fn(b);
  });

  /* Keep the keyboard up when a power-up is tapped mid-turn. */
  app.addEventListener('mousedown', function (e) {
    var n = e.target;
    while (n && n !== app) {
      if (n.classList && n.classList.contains('pu')) { e.preventDefault(); return; }
      n = n.parentNode;
    }
  });

  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.getAttribute && t.getAttribute('data-name') !== null) {
      state.cfg.names[+t.getAttribute('data-name')] = t.value;
      save();
    }
  });

  /* ---------- Go ---------- */

  load();
  renderAll();
})();
</script>
</body>
</html>
